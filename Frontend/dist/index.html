<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="output.css">
    <title>Pixelace</title>
</head>

<body class="w-screen h-screen overflow-hidden select-none touch-none">
    <div id="content-loading" class="flex justify-center items-center w-full h-full bg-white">
        <img src="./assets/spinners/block.svg" alt="Spinner" width="72" height="72">
    </div>

    <div id="content-offline"
        class="hidden flex-col justify-center items-center text-center px-8 w-full h-full bg-white font-fira">
        <img src="./assets/server-down.png" alt="Server Offline" width="156" height="156">
        <span class="font-bold text-xl sm:text-2xl mt-2">Server Offline</span>
        <span class="font-bold text-base sm:text-xl mt-3">The server is temporarily busy, try again later!</span>
    </div>

    <div id="content-main" class="hidden w-full h-full bg-neutral-700">
        <div id="canvas-info"
            class="fixed top-6 left-1/2 w-[156px] py-1 text-center z-[1] -translate-x-1/2 border-2 border-black bg-white font-fira font-bold text-sm sm:text-base">
            <span></span>
            <span></span>
        </div>

        <main id="scene" class="fixed w-full h-full">
            <div id="canvas-wrapper" class="absolute top-1/2 left-1/2 origin-top-left outline outline-2 outline-black pixelated" style="image-rendering: -webkit-optimize-contrast; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; image-rendering: pixelated;">
                <canvas id="canvas" width="1000" height="1000" class="w-full h-full block pixelated" style="image-rendering: -webkit-optimize-contrast; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; image-rendering: pixelated;"></canvas>
                <img id="pixel-cursor" class="absolute top-0 left-0 z-[1] pointer-events-none" src="./assets/pixel-select.svg">
                <div id="pixel-preview" class="absolute top-0 left-0 z-[2] invisible overflow-hidden pointer-events-none"></div>
            </div>
        </main>

        <button id="place-tile-btn"
            class="fixed bottom-6 left-1/2 px-6 py-1 text-center cursor-pointer z-[1] -translate-x-1/2 border-2 border-black bg-white font-fira font-bold text-sm sm:text-base"
            type="button">Place a tile</button>

        <button id="chat-open" type="button"
            class="flex justify-center items-center w-14 h-14 sm:w-16 sm:h-16 z-[1] fixed bottom-6 right-6 rounded-full border-2 border-black bg-white">
            <ion-icon name="chatbubbles-outline"></ion-icon>
        </button>

        <div id="chat"
            class="flex flex-col justify-between w-full sm:w-[380px] md:w-[400px] max-w-full h-full fixed bottom-0 right-0 translate-x-full transition-transform duration-350 ease-out-cubic gap-4 z-[3] p-4 border-l-2 border-black bg-white font-fira">
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                    <h1 class="font-bold text-lg tracking-tight">Live Chat:</h1>
                    <div class="relative inline-block">
                        <div id="chat-lang" data-room="EN"
                            class="flex items-center gap-1 px-1.5 py-0.5 rounded-[2px] cursor-pointer border-2 border-neutral-200 bg-neutral-50">
                        </div>
                        <div id="chat-dropdown" class="hidden absolute z-[10] p-2 bg-white max-h-64 overflow-y-auto border-2 border-black">
                            <ul class="flex flex-col gap-1"></ul>
                        </div>
                    </div>
                </div>
                <ion-icon name="close-outline" id="chat-close" class="cursor-pointer"></ion-icon>
            </div>
            <div id="chat-body"
                class="flex flex-col flex-1 min-h-0 overflow-y-auto overflow-x-hidden w-full gap-2 p-2.5 border-2 border-neutral-200 bg-neutral-50 font-fira font-bold text-xs sm:text-sm leading-snug">
            </div>
            <textarea name="message" id="chat-input" placeholder="Enter a message" maxlength="300" autocomplete="off" rows="1"
                class="box-border font-fira font-bold text-xs sm:text-sm p-3 focus:outline-none border-2 border-black resize-none overflow-hidden block w-full leading-normal shrink-0"></textarea>
        </div>

        <div id="palette"
            class="flex flex-col fixed bottom-0 left-1/2 translate-y-full transition-transform duration-350 ease-out-cubic min-[396px]:max-w-[396px] min-[396px]:border-r-2 min-[396px]:border-l-2 w-full py-4 z-[2] gap-4 -translate-x-1/2 border-t-2 border-black bg-white font-fira">
            <div id="palette-colors" class="overflow-x-auto max-w-full"></div>
            <div class="flex gap-2 px-4 font-bold text-sm sm:text-base">
                <button type="button"
                    class="w-full py-2 text-center cursor-pointer border-2 border-black bg-white">Cancel</button>
                <button type="button" disabled
                    class="w-full py-2 text-center cursor-not-allowed border-2 border-black bg-white disabled:text-neutral-400">Apply</button>
            </div>
        </div>
    </div>

    <script type="module" src="output.js"></script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            const s = document.createElement('script');
            s.defer = true;
            s.src = '/_vercel/insights/script.js';
            document.head.appendChild(s);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
